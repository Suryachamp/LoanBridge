version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: loanbridge_db
    restart: always
    environment:
      MYSQL_DATABASE: 'loanbridge'
      MYSQL_USER: 'laravel'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
