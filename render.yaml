databases:
  - name: loanbridge-db
    databaseName: loanbridge
    user: loanbridge
    plan: free

services:
  - type: web
    name: loanbridge-web
    env: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: loanbridge-db
          property: connectionString
